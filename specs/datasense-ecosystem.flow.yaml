# specs/datasense-ecosystem.flow.yaml
project: DataSense Studio
version: 2.5.0
flows:
  - id: flow_01_prepare_datamend
    surface: https://rkohnmn.github.io/datamend-lab/
    repository: https://github.com/rkohnmn/datamend-lab
    entry_artifact: raw_messy_csv
    guard: check_sentinel_minus_999_and_iso8601_dates
    output_artifact: validated_utf8_csv_and_pipeline_json
  - id: flow_02_visualize_visualgrammar
    surface: https://rkohnmn.github.io/visualgrammar/
    repository: https://github.com/rkohnmn/visualgrammar
    entry_artifact: validated_utf8_csv
    guard: stevens_scale_and_15_point_graphical_honesty_linter
    output_artifact: raincloud_svg_and_vega_lite_spec
  - id: flow_03_investigate_quartetlab
    surface: https://rkohnmn.github.io/quartetlab/
    repository: https://github.com/rkohnmn/quartetlab
    entry_artifact: continuous_xy_pairs
    guard: cooks_distance_threshold_4_over_n_and_theil_sen_robustness
    output_artifact: diagnostic_residual_leverage_csv
  - id: flow_04_infer_resamplelab
    surface: https://rkohnmn.github.io/resamplelab/
    repository: https://github.com/rkohnmn/resamplelab
    entry_artifact: sample_vector_or_two_group_table
    guard: seeded_10000_bootstrap_bca_bias_acceleration
    output_artifact: five_method_confidence_interval_table
  - id: flow_05_forecast_forecastlab
    surface: https://rkohnmn.github.io/forecastlab/
    repository: https://github.com/rkohnmn/forecastlab
    entry_artifact: regular_chronological_series
    guard: stl_decomposition_and_rolling_origin_mase_lt_1
    output_artifact: calibrated_80_95_prediction_fan_csv
